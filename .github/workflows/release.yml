name: release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
  
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run electron-forge -- make -a x64,arm64 -p darwin
      # rpmbuild's %install runs brp-strip with the host's x86-64 strip, which
      # cannot read the aarch64 ELF inside an arm64 package and kills the build.
      # electron-installer-redhat renders a fixed spec and exposes no knob for
      # this, but rpmbuild still reads ~/.rpmmacros: point %__strip at a no-op.
      # Electron ships its binaries already stripped, so nothing is lost.
      - run: echo '%__strip /bin/true' >> ~/.rpmmacros
      - run: npm run electron-forge -- make -a x64,arm64 -p linux
      - run: rm -r out/libecity-desktop*
      - uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "out/make/deb/*/*.deb,out/make/rpm/*/*.rpm,out/make/zip/*/*/*.zip"
          allowUpdates: true

  build-and-release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run make -- -a x64 -p win32
      - uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "out/make/zip/*/*/*.zip,out/make/*/*/*.exe"
          allowUpdates: true
